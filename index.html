<style>
:root{--bg:#F8F3F0;--tx:#63253F;--pn:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1620;--tx:#ffe3ec;--pn:#3a2029}}

*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font-family:Nunito,Inter,system-ui,sans-serif}
.cv{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px;overflow:hidden;background:radial-gradient(circle at 15% 20%,#FFD9E3,transparent 45%),radial-gradient(circle at 85% 80%,#F28BA9,transparent 40%),#FFF9F7;color:#63253F}.cv .yarn{position:absolute}.cvg{position:relative;z-index:2;max-width:520px;width:100%;text-align:center;padding:36px 28px;border-radius:36px;background:rgba(255,255,255,.55);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.85);box-shadow:0 20px 50px rgba(199,47,101,.2),inset 0 1px 0 #fff}.cvg img{width:100%;max-width:400px}.cvg h1{font:800 30px Nunito,sans-serif;margin:8px 0 6px}.cvg p{margin:0 0 18px;font-size:16px}.cvb{display:inline-flex;align-items:center;justify-content:center;height:52px;padding:0 28px;border-radius:16px;background:#C72F65;color:#fff;font:800 16px Nunito,sans-serif;text-decoration:none;box-shadow:0 8px 20px rgba(199,47,101,.35)}.cvf{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:0 0 20px}.cvf span{padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.7);border:1px solid #EBC6D1;font:700 12px Nunito,sans-serif}
.pg{display:flex;min-height:100vh;align-items:center;gap:24px;padding:20px;justify-content:center;flex-wrap:wrap}
.side{width:300px;max-width:100%}.side h1{font-size:22px;margin:0 0 4px}.side p{font-size:13px;opacity:.8;margin:0 0 12px}
.grp{margin:10px 0 4px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#C72F65}
.pill{display:inline-block;margin:0 4px 4px 0;padding:6px 10px;border-radius:99px;border:1px solid #EBC6D1;background:var(--pn);color:var(--tx);font:600 12px Nunito,sans-serif;cursor:pointer}
.pill.on{background:#C72F65;color:#fff;border-color:#C72F65}
.sw{display:flex;gap:4px;margin:10px 0}.sw i{flex:1;height:26px;border-radius:8px;display:block}
.tok{font-size:12px;line-height:1.5;opacity:.85}
#wrap{flex:none}
#ph{width:393px;height:852px;background:#FFF9F7;border-radius:40px;border:8px solid #2b1a22;overflow:hidden;position:relative;transform-origin:0 0;color:#63253F;font-size:14px;line-height:1.4;box-sizing:content-box;margin:-8px}
#ph *{font-family:Nunito,Inter,system-ui,sans-serif}
.st{height:28px;display:flex;justify-content:space-between;padding:8px 24px 0;font-size:12px;font-weight:700}
#scr{height:824px;overflow-y:auto;padding:4px 20px 96px;background:radial-gradient(circle at 90% 0,#FFD9E3 0,transparent 40%),#FFF9F7}
#scr.cn{display:flex;flex-direction:column;justify-content:center;padding-bottom:20px}
h2{font-size:25px;margin:0;font-weight:800}h3{font-size:18px;margin:18px 0 10px;font-weight:700;display:flex;justify-content:space-between}h3 a{font-size:13px;color:#C72F65;font-weight:700}
.c{background:#fff;border:1px solid #EBC6D1;border-radius:22px;padding:16px;margin-bottom:12px}
.g{background:rgba(255,255,255,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(235,198,209,.8);box-shadow:0 8px 24px rgba(199,47,101,.12),inset 0 1px 0 #fff;border-radius:28px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;height:52px;border-radius:16px;border:0;background:#C72F65;color:#fff;font-weight:800;font-size:16px;width:100%;cursor:pointer;margin:8px 0}
.btn.s{background:#FFD9E3;color:#C72F65;height:46px}.btn.m{height:42px;width:auto;padding:0 16px;font-size:14px;margin:0}.btn.d{opacity:.45}
.in{width:100%;height:52px;border:1px solid #EBC6D1;border-radius:14px;padding:0 14px;font-size:15px;background:#fff;color:#63253F;margin:4px 0 10px}
.in.err{border-color:#C72F65;background:#fff3f6}.lb{font-size:13px;font-weight:700}.er{color:#C72F65;font-size:12px;margin:-6px 0 8px}
.chip{display:inline-block;padding:9px 14px;border-radius:14px;background:#fff;border:1px solid #EBC6D1;font-size:13px;font-weight:700;margin:0 6px 6px 0;cursor:pointer;color:#63253F}.chip.on{background:#C72F65;color:#fff;border-color:#C72F65}
.sc2{white-space:nowrap;overflow-x:auto;margin:0 -20px;padding:0 20px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.r{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}.f1{flex:1}
.bar{height:8px;border-radius:9px;background:#FFD9E3;overflow:hidden}.bar b{display:block;height:100%;background:#C72F65;border-radius:9px}
.mt{font-size:12.5px;opacity:.75}.big{font-size:28px;font-weight:800}
.yarn{display:block;border-radius:50%;flex:none;background:repeating-linear-gradient(35deg,rgba(255,255,255,.3) 0 2px,transparent 2px 6px),radial-gradient(circle at 30% 26%,#fff8 0,transparent 30%),radial-gradient(circle at 35% 30%,var(--y),var(--y) 55%,rgba(0,0,0,.28) 130%);box-shadow:0 10px 14px -6px rgba(99,37,63,.45),inset -6px -8px 14px rgba(0,0,0,.14)}
.ph4{aspect-ratio:4/5;border-radius:18px;display:flex;align-items:center;justify-content:center;position:relative;background:linear-gradient(160deg,#FFD9E3,#FFF9F7)}
.hrt{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;color:#C72F65;cursor:pointer;font-size:17px}
.nv{position:absolute;left:12px;right:12px;bottom:14px;height:68px;border-radius:26px;display:flex;justify-content:space-around;align-items:center;background:rgba(255,255,255,.78);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid #EBC6D1;box-shadow:0 8px 24px rgba(99,37,63,.15)}
.nv b{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:#8a6a76;min-width:56px;min-height:48px;justify-content:center;cursor:pointer}.nv b span{font-size:21px}.nv b.on{color:#C72F65}
.hd{display:flex;align-items:center;gap:10px;margin:6px 0 14px}.hd b{width:40px;height:40px;border-radius:14px;background:#fff;border:1px solid #EBC6D1;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px}
.tg{display:inline-block;padding:3px 9px;border-radius:9px;background:#FFD9E3;font-size:11.5px;font-weight:700;color:#C72F65}.tg.ok{background:#e3eee5;color:#4d6e53}
.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #f3dfe5;cursor:pointer;font-weight:600}.row:last-child{border:0}.row span:last-child{margin-left:auto;opacity:.5}
.dlg{position:absolute;inset:0;background:rgba(99,37,63,.35);display:flex;align-items:center;justify-content:center;padding:30px;z-index:9}.hide{display:none!important}
.stp{display:flex;gap:12px;margin-bottom:12px}.stp i{flex:none;width:28px;height:28px;border-radius:50%;background:#C72F65;color:#fff;font-style:normal;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
.dots{display:flex;gap:6px;justify-content:center;margin:12px}.dots i{width:8px;height:8px;border-radius:9px;background:#EBC6D1}.dots i.on{width:24px;background:#C72F65}
.ck{display:flex;gap:10px;align-items:center;padding:7px 0;cursor:pointer}.ck i{width:22px;height:22px;border-radius:7px;border:2px solid #C72F65;display:flex;align-items:center;justify-content:center;font-style:normal;color:#fff;font-size:13px}.ck.on i{background:#C72F65}
.cm{display:flex;justify-content:space-between;padding:6px 0}.cm.t{font-size:18px;font-weight:800;border-top:1px dashed #EBC6D1;margin-top:6px;padding-top:12px}

pattern:()=>`${hd('Pattern')}<div class="ph4" style="aspect-ratio:16/11">${Y('#F28BA9',120)}</div><h2 style="margin-top:14px">Daisy Coaster</h2><div class="r" style="margin:6px 0"><span class="tg">Beginner</span><span class="tg">⏱ 1 hr</span><span class="tg">Hook 4 mm</span></div><p>A quick round coaster with a cheerful flower center. Perfect for first projects.</p><div class="c"><b>Materials</b>${['Cotton DK, rose — 30 g','Cotton DK, cream — 10 g','4 mm hook','Tapestry needle'].map((x,i)=>`<div class="ck ${i<2?'on':''}" data-t="1"><i>✓</i>${x}</div>`).join('')}</div><div class="c"><b>Instructions</b><div class="stp" style="margin-top:10px"><i>1</i><span>Make a magic ring, ch 2, work 12 dc into the ring.</span></div><div class="stp"><i>2</i><span>2 dc in each st around (24 sts). Join with sl st.</span></div><p class="mt"><b>Abbreviations:</b> ch chain · dc double crochet · sl st slip stitch</p></div><div class="btn" data-go="project">Add to My Projects</div><div class="btn s" data-t="1">♡ Save Pattern</div>`,

projects:()=>`${hd('My Projects')}<div class="r" style="margin-bottom:10px"><span class="chip on" data-t="1">Current (3)</span><span class="chip" data-t="1">Completed (5)</span></div><div class="sc2"><span class="tg">All</span> <span class="tg">In progress</span> <span class="tg">Planned</span> <span class="tg">On hold</span></div><div style="margin-top:12px">${pr('Rose Bloom Tote',68,'#F28BA9','Nov 12')}${pr('Baby Blanket',35,'#fff0e8','Dec 1')}${pr('Bunny Amigurumi',10,'#C72F65','Dec 20')}</div><div class="btn" data-go="newproject">＋ New Project</div>`,
project:()=>`${hd('Project')}<div class="ph4" style="aspect-ratio:16/10">${Y('#F28BA9',110)}</div><div class="r sp" style="margin-top:12px"><h2 style="font-size:22px">Rose Bloom Tote</h2><span class="tg">In progress</span></div><div class="c" style="margin-top:10px"><div class="r sp"><b>Progress</b><b style="color:#C72F65">68%</b></div>${bar(68)}<div class="r" style="margin-top:10px"><span class="chip" data-t="1">−10</span><span class="chip on" data-t="1">Update</span><span class="chip" data-t="1">+10</span></div></div><div class="c"><b>Pattern:</b> Mini Market Tote<br><span class="mt">Started Oct 2 · Target Nov 12</span></div><div class="c"><b>Materials</b>${['Rose Cotton DK ×3','4 mm hook','Bag lining'].map((x,i)=>`<div class="ck ${i?'':'on'}" data-t="1"><i>✓</i>${x}</div>`).join('')}</div><div class="c"><b>Notes</b><p class="mt">Use stitch markers every 20 sts for the handles.</p></div><div class="g2"><div class="btn s" data-go="newproject">Edit</div><div class="btn" data-go="projects">Mark Completed</div></div>`,
newproject:()=>`${hd('New Project')}<div class="ph4" style="aspect-ratio:16/7;border:2px dashed #EBC6D1">＋ Add photo</div><div class="lb" style="margin-top:12px">Project name *</div><input class="in" value="Rose Bloom Tote"><div class="lb">Description</div><input class="in" placeholder="What are you making?"><div class="lb">Pattern (optional)</div><input class="in" value="Mini Market Tote ▾"><div class="g2"><div><div class="lb">Start</div><input class="in" value="Oct 2"></div><div><div class="lb">Target</div><input class="in" value="Nov 12"></div></div><div class="lb">Notes</div><input class="in"><div class="btn" data-go="project">Save Project</div>`,
color:()=>{const h=pal.h,m=pal.m,H=m=='comp'?[h,h+180,h+20,h+200,h-20]:m=='tri'?[h,h+120,h+240,h+60,h+180]:[h,h+30,h-30,h+60,h-60];const C=H.map((x,i)=>hex(x,i?55:62,i?72:52));return `${hd('Color Helper')}<div class="g"><div class="r" style="justify-content:center;margin:4px 0 10px">${C.slice(0,4).map((c,i)=>Y(c,i==0?76:56)).join('')}</div><div class="r">${[['analog','Analogous'],['comp','Complementary'],['tri','Triadic']].map(a=>`<span class="chip ${m==a[0]?'on':''}" data-pm="${a[0]}">${a[1]}</span>`).join('')}</div></div><div class="lb">Main color (hue ${h}°)</div><input type="range" id="hue" min="0" max="359" value="${h}" style="width:100%;accent-color:#C72F65;margin:10px 0"><div class="c">${C.map((c,i)=>`<div class="r" style="padding:6px 0"><i style="width:44px;height:44px;border-radius:14px;background:${c};display:block"></i><div class="f1"><b>${i?'':'Main · '}${NM[Math.floor(((H[i]%360+360)%360)/45)]}</b><div class="mt">${c.toUpperCase()}</div></div></div>`).join('')}</div><div class="g2"><div class="btn s" data-pr="1">Generate Another</div><div class="btn" data-t="1">Save Palette</div></div><h3>Saved Palettes</h3><div class="c r">${['#F28BA9','#FFD9E3','#C72F65','#fff0e8'].map(c=>`<i style="flex:1;height:30px;border-radius:9px;background:${c}"></i>`).join('')}</div>`},
cost:()=>{const f=(l,id,v)=>`<div><div class="lb">${l}</div><input class="in" id="${id}" type="number" value="${v}"></div>`;return `${hd('Cost Calculator')}<div class="lb">Project</div><input class="in" value="Rose Bloom Tote ▾"><div class="g2">${f('Yarn (৳)','cy',450)}${f('Materials (৳)','cm',120)}${f('Extra (৳)','ce',80)}${f('Labor hours','ch',4)}${f('Rate (৳/hr)','cr',100)}${f('Markup (%)','ck',30)}</div><div class="c"><div class="cm"><span>Materials</span><b id="o1"></b></div><div class="cm"><span>Labor</span><b id="o2"></b></div><div class="cm"><span>Extras</span><b id="o3"></b></div><div class="cm t"><span>Total cost</span><b id="o4"></b></div><div class="cm t" style="color:#C72F65;border-top:0"><span>Selling price</span><b id="o5"></b></div><p class="mt">Total cost is what you spent. Selling price adds your markup so you earn a profit.</p></div><div class="g2"><div class="btn s" data-go="cost">Reset</div><div class="btn" data-t="1">Save</div></div>`},
learn:()=>`${hd('Learn Crochet')}<div class="g r" data-go="lesson"><div class="f1"><span class="tg">Continue</span><h3 style="margin:6px 0">Single Crochet</h3>${bar(60)}</div>${Y('#F28BA9',70)}</div><div class="mt">4 of 12 lessons completed</div><div class="g2" style="margin-top:12px">${[['Getting Started','#fff0e8','3 lessons'],['Basic Stitches','#F28BA9','5 lessons'],['Techniques','#C72F65','4 lessons'],['Terminology','#D5A45B','6 terms']].map(a=>`<div class="c" style="margin:0" data-go="lesson">${Y(a[1],50)}<b style="display:block;margin-top:10px">${a[0]}</b><div class="mt">Beginner · ${a[2]}</div></div>`).join('')}</div>`,
lesson:()=>`${hd('Single Crochet')}<div class="ph4" style="aspect-ratio:16/9">${Y('#F28BA9',90)}</div><div class="r sp" style="margin:12px 0 6px"><b>Step 2 of 5</b><span class="tg">Beginner · 8 min</span></div>${bar(40)}<div class="c" style="margin-top:12px"><b>Materials</b><div class="mt">4 mm hook · DK cotton yarn</div></div><div class="c"><div class="stp"><i>2</i><span>Insert hook into the next stitch, yarn over and pull through (2 loops on hook).</span></div><p class="mt"><b>sc</b> = single crochet · <b>yo</b> = yarn over</p></div><div class="g2"><div class="btn s">‹ Previous</div><div class="btn">Next ›</div></div><div class="btn s" data-go="learn">Mark as Completed</div>`,
tutor:()=>{const T=['Input','Loading','Result','Invalid','Unsupported','Failed'];const b=`<div class="r" style="flex-wrap:wrap;margin:8px 0">${T.map((t,i)=>`<span class="chip ${tut==i?'on':''}" data-tu="${i}" style="margin:0;padding:6px 10px">${t}</span>`).join('')}</div>`;let m;if(tut==0)m=`<div class="g"><div style="float:right">${Y('#F28BA9',70)}</div><p class="mt" style="max-width:220px">Paste a tutorial link or type the instructions. We’ll turn them into clear steps.</p><div class="lb" style="clear:both">Tutorial URL</div><input class="in" placeholder="https://…"><div class="btn s" data-t="1">Paste Link</div><div class="btn" data-tu="1">Simplify Tutorial</div><div class="mt" style="text-align:center">or enter instructions manually</div></div>`;else if(tut==1)m=`<div class="c" style="text-align:center;padding:40px"><div class="bar"><b style="width:55%"></b></div><p>Reading tutorial…</p></div>`;else if(tut==2)m=`<div class="c"><b>Beginner Granny Square</b><p>Work small rounds of clusters, turning corners with chain spaces.</p></div><div class="c"><div class="stp"><i>1</i><span>Make a magic ring and chain 3.</span></div><div class="stp"><i>2</i><span>Work 2 dc, ch 2 — repeat 3 times.</span></div><div class="stp"><i>3</i><span>Join with a slip stitch.</span></div></div><div class="c"><b>Abbreviations</b><div class="mt">ch chain · dc double crochet · sl st slip stitch</div></div><div class="c"><b>Difficult parts</b><div class="mt">Corner ch 2 spaces: stitch into the space, not the stitch.</div></div><div class="g2"><div class="btn s" data-t="1">Copy</div><div class="btn" data-t="1">Save to Notes</div></div>`;else m=`<div class="c" style="text-align:center;border-color:#C72F65"><b>${['','','','That link doesn’t look valid','This link can’t be read automatically','Something went wrong'][tut]}</b><p class="mt">${tut==3?'Check the address and try again.':tut==4?'Videos can’t always be accessed or transcribed. Paste the written steps instead.':'Please try again in a moment.'}</p><div class="btn s" data-tu="0">${tut==4?'Enter instructions manually':'Try Again'}</div></div>`;return `${hd('Make crochet tutorials easier.')}${b}${m}`},
studio:()=>`<div class="g r" style="padding:6px 14px;margin-bottom:10px;border-radius:20px;justify-content:center"><img src="${LOGO}" alt="TasHu’S Maditation" style="height:56px"></div><div class="g" style="text-align:center;margin-top:10px"><span class="yarn" style="--y:#F28BA9;width:76px;height:76px;margin:0 auto 8px"></span><h2 style="font-size:22px">Tashu</h2><p class="mt">Crochet lover, yarn collector.</p><div class="r sp"><div><b class="big">3</b><div class="mt">Current</div></div><div><b class="big">5</b><div class="mt">Done</div></div><div><b class="big">33%</b><div class="mt">Learning</div></div></div></div><div class="c">${[['Yarn Stash','stash'],['Saved Items','saved'],['Color Palettes','saved'],['Tutorial Simplifier','tutor'],['Settings','settings']].map(a=>`<div class="row" data-go="${a[1]}"><span>◍</span>${a[0]}<span>›</span></div>`).join('')}</div>`,
saved:()=>`${hd('Saved Items')}<div class="r"><span class="chip on" data-t="1">Patterns</span><span class="chip" data-t="1">Palettes</span><span class="chip" data-t="1">Notes</span></div><div class="g2" style="margin-top:8px">${PAT.slice(0,4).map(pc).join('')}</div><div class="c" style="text-align:center"><p class="mt">Tap ♥ to remove from saved. Empty tabs show a friendly prompt to explore patterns.</p></div>`,
settings:()=>`${hd('Settings')}<div class="c">${['Account & profile','Notifications','Appearance','Privacy','About the app'].map(x=>`<div class="row">${x}<span>›</span></div>`).join('')}</div><div class="btn s" data-tg="so">Sign Out</div><div class="dlg hide" id="so"><div class="c" style="margin:0"><b>Sign out?</b><p>You can sign back in anytime.</p><div class="btn s" data-tg="so">Cancel</div><div class="btn" data-go="signin">Sign Out</div></div></div>`
};
const G={'Onboarding & Auth':['splash','onb','signin','signup'],'Home':['home'],'Patterns':['finder','pattern'],'Yarn':['stash','addyarn'],'Projects':['projects','project','newproject'],'Creative Tools':['color','cost'],'Learning':['learn','lesson'],'Tutorial Simplifier':['tutor'],'Profile & Settings':['studio','saved','settings']};
const L={splash:'1 Splash',onb:'2 Onboarding',signin:'3 Sign In',signup:'4 Sign Up',home:'5 Home',finder:'6 Pattern Finder',pattern:'7 Pattern Details',stash:'8 Yarn Stash',addyarn:'9 Add Yarn',projects:'10 Projects',project:'11 Project Details',newproject:'12 New Project',color:'13 Color Helper',cost:'14 Cost ৳',learn:'15 Learn',lesson:'16 Lesson',tutor:'17 Simplifier',studio:'18 My Studio',saved:'19 Saved',settings:'20 Settings'};
function calc(){const v=i=>+document.getElementById(i).value||0,m=v('cy')+v('cm'),l=v('ch')*v('cr'),e=v('ce'),t=m+l+e,p=t*(1+v('ck')/100),f=n=>'৳'+Math.round(n).toLocaleString('en-US');o1.textContent=f(m);o2.textContent=f(l);o3.textContent=f(e);o4.textContent=f(t);o5.textContent=f(p)}
function go(id,back){if(!back&&cur!=id)hist.push(cur);cur=id;const s=$('#scr');s.className=NO.includes(id)&&id!='signin'&&id!='signup'?'cn':'';s.innerHTML=S[id]();s.scrollTop=0;$('#nvh').innerHTML=NO.includes(id)?'':`<div class="nv">${NAV.map(n=>`<b class="${({home:'home',finder:'finder,pattern',projects:'projects,project,newproject',learn:'learn,lesson',studio:'studio,saved,settings,stash'}[n[0]]).split(',').includes(id)?'on':''}" data-go="${n[0]}"><span>${n[1]}</span>${n[2]}</b>`).join('')}</div>`;if(id=='cost'){document.querySelectorAll('#scr input[type=number]').forEach(i=>i.oninput=calc);calc()}if(id=='color')$('#hue').oninput=e=>{pal.h=+e.target.value;go('color',1)}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-ob],[data-tu],[data-pm],[data-pr],[data-tg],[data-t]');if(!t)return;const d=t.dataset;if(d.go){if(d.go=='back')go(hist.pop()||'home',1);else go(d.go)}else if(d.ob){ob++;go('onb',1)}else if(d.tu){tut=+d.tu;go('tutor',1)}else if(d.pm){pal.m=d.pm;go('color',1)}else if(d.pr){pal.h=Math.floor(Math.random()*360);go('color',1)}else if(d.tg)document.getElementById(d.tg).classList.toggle('hide');else if(d.t){if(t.classList.contains('hrt'))t.textContent=t.textContent=='♥'?'♡':'♥';else t.classList.toggle('on')}});
function fit(){const s=Math.min(1,(innerHeight-16)/870,(innerWidth-24)/409);$('#ph').style.transform=`scale(${s})`;$('#wrap').style.width=409*s+'px';$('#wrap').style.height=870*s+'px'}
addEventListener('resize',fit);fit();go('splash');
</script></body></html>
